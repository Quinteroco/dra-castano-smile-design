name: Update Instagram stats

# Manual trigger for now. Once IG_USER_ID and IG_ACCESS_TOKEN are set
# in Settings → Secrets → Actions, uncomment the schedule below to
# refresh assets/followers.json automatically (e.g. once a day).
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from the Instagram Graph API
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "IG_USER_ID / IG_ACCESS_TOKEN not configured yet — skipping."
            exit 0
          fi

          resp=$(curl -s "https://graph.facebook.com/v19.0/${IG_USER_ID}?fields=followers_count,media_count,follows_count&access_token=${IG_ACCESS_TOKEN}")
          followers=$(echo "$resp" | jq -r '.followers_count')
          posts=$(echo "$resp" | jq -r '.media_count')
          following=$(echo "$resp" | jq -r '.follows_count')

          if [ "$followers" = "null" ] || [ -z "$followers" ]; then
            echo "Graph API call failed: $resp"
            exit 1
          fi

          display=$followers
          if [ "$followers" -ge 1000 ]; then
            display=$(awk -v f="$followers" 'BEGIN{printf "%.1fK", f/1000}')
          fi

          cat > assets/followers.json <<EOF
          {
            "followers": $followers,
            "display": "$display",
            "posts": $posts,
            "following": $following,
            "updated": "$(date -u +%F)",
            "source": "instagram_graph_api"
          }
          EOF

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- assets/followers.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/followers.json
            git commit -m "Auto-update Instagram stats"
            git push
          else
            echo "No changes."
          fi
